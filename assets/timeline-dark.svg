<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="The journey">
<title>The journey</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3}.m{fill:#9198a1}.n{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}@keyframes up{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes fade{from{opacity:0}to{opacity:1}}.col{transform-box:fill-box;transform-origin:bottom;animation:up .9s ease-out both}.bar{transform-box:fill-box;transform-origin:left;animation:grow .9s ease-out both}.fd{animation:fade 1s ease-out both}@media (prefers-reduced-motion:reduce){.col,.bar,.fd{animation:none}}</style>
<rect x="0.5" y="0.5" width="859" height="259" rx="12" fill="#0d1117" stroke="#3d444d"/>
<text x="28" y="40" font-size="17" font-weight="700">The journey — 15+ years</text>
<text x="28" y="62" font-size="12.5" class="m">From an informatics diploma to AI-native engineering</text>

<line x1="95" x2="765" y1="112" y2="112" stroke="#3d444d" stroke-width="2"/>
<g class="fd" style="animation-delay:0.00s">
<circle cx="125.0" cy="112" r="9" fill="#0d1117" stroke="#F2545B" stroke-width="2"/>
<circle cx="125.0" cy="112" r="4" fill="#F2545B"/>
<text x="125.0" y="90" font-size="15" font-weight="700" text-anchor="middle">2010</text>
<text x="125.0" y="146" font-size="12.5" font-weight="700" text-anchor="middle">Informatics</text>
<text x="125.0" y="166" font-size="11.5" class="m" text-anchor="middle">Diploma in</text>
<text x="125.0" y="182" font-size="11.5" class="m" text-anchor="middle">informatics</text>
<text x="125.0" y="198" font-size="11.5" class="m" text-anchor="middle">management at</text>
<text x="125.0" y="214" font-size="11.5" class="m" text-anchor="middle">Telkom University;</text>
<text x="125.0" y="230" font-size="11.5" class="m" text-anchor="middle">first web builds.</text>
</g>
<g class="fd" style="animation-delay:0.12s">
<circle cx="247.0" cy="112" r="9" fill="#0d1117" stroke="#F2545B" stroke-width="2"/>
<circle cx="247.0" cy="112" r="4" fill="#F2545B"/>
<text x="247.0" y="90" font-size="15" font-weight="700" text-anchor="middle">2012</text>
<text x="247.0" y="146" font-size="12.5" font-weight="700" text-anchor="middle">Newtype</text>
<text x="247.0" y="166" font-size="11.5" class="m" text-anchor="middle">CTO &amp; R&amp;D lead for</text>
<text x="247.0" y="182" font-size="11.5" class="m" text-anchor="middle">government, campus</text>
<text x="247.0" y="198" font-size="11.5" class="m" text-anchor="middle">and private</text>
<text x="247.0" y="214" font-size="11.5" class="m" text-anchor="middle">clients.</text>
</g>
<g class="fd" style="animation-delay:0.24s">
<circle cx="369.0" cy="112" r="9" fill="#0d1117" stroke="#F2545B" stroke-width="2"/>
<circle cx="369.0" cy="112" r="4" fill="#F2545B"/>
<text x="369.0" y="90" font-size="15" font-weight="700" text-anchor="middle">2015</text>
<text x="369.0" y="146" font-size="12.5" font-weight="700" text-anchor="middle">ITB &amp; SE Asia</text>
<text x="369.0" y="166" font-size="11.5" class="m" text-anchor="middle">M.T. in digital</text>
<text x="369.0" y="182" font-size="11.5" class="m" text-anchor="middle">media &amp; game at</text>
<text x="369.0" y="198" font-size="11.5" class="m" text-anchor="middle">ITB; e-learning</text>
<text x="369.0" y="214" font-size="11.5" class="m" text-anchor="middle">across Southeast</text>
<text x="369.0" y="230" font-size="11.5" class="m" text-anchor="middle">Asia.</text>
</g>
<g class="fd" style="animation-delay:0.36s">
<circle cx="491.0" cy="112" r="9" fill="#0d1117" stroke="#F2545B" stroke-width="2"/>
<circle cx="491.0" cy="112" r="4" fill="#F2545B"/>
<text x="491.0" y="90" font-size="15" font-weight="700" text-anchor="middle">2019</text>
<text x="491.0" y="146" font-size="12.5" font-weight="700" text-anchor="middle">Product &amp; ops</text>
<text x="491.0" y="166" font-size="11.5" class="m" text-anchor="middle">COO and product</text>
<text x="491.0" y="182" font-size="11.5" class="m" text-anchor="middle">owner of an HR and</text>
<text x="491.0" y="198" font-size="11.5" class="m" text-anchor="middle">e-learning SaaS for</text>
<text x="491.0" y="214" font-size="11.5" class="m" text-anchor="middle">four years.</text>
</g>
<g class="fd" style="animation-delay:0.48s">
<circle cx="613.0" cy="112" r="9" fill="#0d1117" stroke="#F2545B" stroke-width="2"/>
<circle cx="613.0" cy="112" r="4" fill="#F2545B"/>
<text x="613.0" y="90" font-size="15" font-weight="700" text-anchor="middle">2021</text>
<text x="613.0" y="146" font-size="12.5" font-weight="700" text-anchor="middle">Growth engineering</text>
<text x="613.0" y="166" font-size="11.5" class="m" text-anchor="middle">Full stack plus</text>
<text x="613.0" y="182" font-size="11.5" class="m" text-anchor="middle">SEO, GEO &amp; AEO for</text>
<text x="613.0" y="198" font-size="11.5" class="m" text-anchor="middle">20+ accounts in</text>
<text x="613.0" y="214" font-size="11.5" class="m" text-anchor="middle">three countries.</text>
</g>
<g class="fd" style="animation-delay:0.60s">
<circle cx="735.0" cy="112" r="9" fill="#0d1117" stroke="#9B7BF0" stroke-width="2"/>
<circle cx="735.0" cy="112" r="4" fill="#9B7BF0"/>
<text x="735.0" y="90" font-size="15" font-weight="700" text-anchor="middle">2026</text>
<text x="735.0" y="146" font-size="12.5" font-weight="700" text-anchor="middle">AI-native</text>
<text x="735.0" y="166" font-size="11.5" class="m" text-anchor="middle">Claude Code as</text>
<text x="735.0" y="182" font-size="11.5" class="m" text-anchor="middle">daily pair · VR, 3D</text>
<text x="735.0" y="198" font-size="11.5" class="m" text-anchor="middle">GIS and agents at</text>
