# Renders the contribution-snake animation shown in the profile README and
# publishes it to the `output` branch. Runs daily, on demand, and whenever
# this workflow itself changes.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E70011&color_dots=#ebedf0,#fbd0d4,#f48b95,#e3303d,#a3101d
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF6B76&color_dots=#161b22,#4c1219,#8f1d29,#d4303d,#ff6b76

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
